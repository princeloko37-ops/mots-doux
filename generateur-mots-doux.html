<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plume & Cœur — Générateur de mots doux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@500;600;700&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#F7EFE3;
    --paper:#FBF6EC;
    --wine:#7A2B3B;
    --wine-deep:#4E1723;
    --gold:#AD8A4E;
    --ink:#2E2320;
    --ink-soft:#5B4A44;
    --line:#D9C7AE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 800px at 15% -10%, #8c3245 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, #5a1c28 0%, transparent 55%),
      var(--wine-deep);
    min-height:100vh;
    font-family:'Karla', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  .stage{
    width:100%;
    max-width:480px;
  }

  .eyebrow-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
    padding:0 6px;
  }
  .brand{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.15rem;
    color:var(--ivory);
    letter-spacing:0.02em;
  }
  .brand b{font-style:normal; font-weight:600;}
  .count{
    font-size:0.78rem;
    color:#E7CFB8;
  }

  .card{
    background:var(--paper);
    border-radius:4px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.5) inset;
    position:relative;
    overflow:hidden;
    padding:38px 34px 30px;
    border:1px solid #EADFC9;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid var(--line);
    pointer-events:none;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:1.5rem;
    margin:0 0 4px;
    color:var(--wine-deep);
    text-align:center;
  }
  .sub{
    text-align:center;
    color:var(--ink-soft);
    font-size:0.86rem;
    margin:0 0 24px;
  }

  .field{
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    font-family:'Karla', sans-serif;
    font-size:0.95rem;
    padding:6px 2px;
    color:var(--ink);
  }
  .field input:focus{
    outline:none;
    border-bottom-color:var(--wine);
  }

  .tabs{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  .tab{
    flex:1 1 auto;
    text-align:center;
    padding:8px 6px;
    border:1px solid var(--line);
    border-radius:3px;
    font-size:0.78rem;
    color:var(--ink-soft);
    cursor:pointer;
    background:transparent;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
    font-family:'Karla', sans-serif;
  }
  .tab.active{
    background:var(--wine);
    border-color:var(--wine);
    color:var(--ivory);
  }

  .letter{
    background:var(--ivory);
    border:1px solid var(--line);
    border-radius:2px;
    min-height:150px;
    padding:24px 22px;
    margin-bottom:20px;
    position:relative;
    display:flex;
    align-items:center;
  }
  .letter p{
    font-family:'Caveat', cursive;
    font-size:1.65rem;
    line-height:1.4;
    color:var(--wine-deep);
    margin:0;
    width:100%;
  }
  .letter .placeholder{
    font-family:'Karla', sans-serif;
    font-size:0.85rem;
    color:#B7A896;
    font-style:italic;
  }

  .actions{
    display:flex;
    gap:10px;
  }
  button.primary{
    flex:1;
    background:var(--wine);
    color:var(--ivory);
    border:none;
    padding:13px 16px;
    border-radius:3px;
    font-family:'Karla', sans-serif;
    font-weight:600;
    font-size:0.88rem;
    letter-spacing:0.01em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:background .15s ease, transform .05s ease;
  }
  button.primary:hover{background:#8f3448;}
  button.primary:active{transform:scale(0.98);}

  button.seal{
    width:52px;
    height:52px;
    min-width:52px;
    border-radius:50%;
    border:none;
    background:radial-gradient(circle at 35% 30%, #c79a55, var(--gold) 55%, #8a6a34 100%);
    color:var(--wine-deep);
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:1.2rem;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.25);
    transition:transform .12s ease;
  }
  button.seal:hover{transform:rotate(-8deg) scale(1.04);}
  button.seal:active{transform:rotate(-4deg) scale(0.96);}

  .status{
    text-align:center;
    font-size:0.75rem;
    color:var(--ink-soft);
    margin-top:12px;
    min-height:16px;
  }

  @media (max-width:380px){
    .card{padding:30px 22px 24px;}
    .letter p{font-size:1.4rem;}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="eyebrow-row">
    <span class="brand">Plume <b>&</b> Cœur</span>
    <span class="count" id="genCount">0 mot doux écrit</span>
  </div>

  <div class="card">
    <h1>Un mot doux, à l'instant</h1>
    <p class="sub">Choisis un ton, ajoute un prénom, et laisse la plume faire le reste.</p>

    <div class="field">
      <label for="nameInput">Pour qui ? (optionnel)</label>
      <input type="text" id="nameInput" placeholder="Ex. Aïcha, mon amour, toi..." maxlength="30">
    </div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-cat="tendre">Tendre</button>
      <button class="tab" data-cat="passionne">Passionné</button>
      <button class="tab" data-cat="taquin">Taquin</button>
      <button class="tab" data-cat="poetique">Poétique</button>
    </div>

    <div class="letter">
      <p class="placeholder" id="messageText">Appuie sur le sceau doré pour recevoir ton premier mot doux.</p>
    </div>

    <div class="actions">
      <button class="seal" id="sealBtn" title="Générer un mot doux">✦</button>
      <button class="primary" id="copyBtn">Copier ce mot</button>
      <button class="primary" id="waBtn" style="background:#3d7a52;">Envoyer sur WhatsApp</button>
    </div>

    <div class="status" id="statusText"></div>
  </div>
</div>

<script>
const templates = {
  tendre: [
    "{name}, ta présence est le calme dont mon cœur avait besoin sans le savoir.",
    "Chaque jour à tes côtés, {name}, ressemble à un matin de plus en plus doux.",
    "{name}, je n'ai pas besoin de grands mots : ton sourire suffit à faire mon bonheur.",
    "Avec toi, {name}, même les silences sont pleins de tendresse.",
    "{name}, tu es ce genre de bonheur simple qu'on n'espérait plus trouver."
  ],
  passionne: [
    "{name}, mon cœur s'emballe rien qu'à l'idée de te retrouver ce soir.",
    "Il y a un feu en moi, {name}, et il porte ton nom.",
    "{name}, je te veux entière, aujourd'hui, demain, et tous les jours suivants.",
    "Ton regard, {name}, a le pouvoir d'effacer toutes mes distances.",
    "{name}, je n'ai jamais désiré quelqu'un comme je te désire, sans mesure."
  ],
  taquin: [
    "{name}, attention : je pourrais bien voler un baiser de plus aujourd'hui.",
    "On dit que l'amour rend fou, {name}... alors prépare-toi, je deviens ingérable.",
    "{name}, je t'aurais bien envoyé un poème, mais je préfère te faire rougir en vrai.",
    "Petit avertissement, {name} : je compte bien te faire sourire toute la journée.",
    "{name}, si le charme était un crime, tu serais déjà en prison à vie."
  ],
  poetique: [
    "{name}, tu es l'encre discrète qui écrit les plus belles lignes de mes journées.",
    "Comme la lune ne quitte jamais vraiment le ciel, {name}, tu ne quittes jamais mes pensées.",
    "{name}, mon cœur a appris ton nom comme on apprend une chanson qu'on ne veut plus oublier.",
    "Il y a des amours qui crient et d'autres qui murmurent, {name} — le nôtre sait faire les deux.",
    "{name}, entre nous, même le temps semble écrire plus lentement."
  ]
};

let currentCat = 'tendre';
let genCount = 0;
let lastMessage = '';

const tabs = document.querySelectorAll('.tab');
const messageEl = document.getElementById('messageText');
const sealBtn = document.getElementById('sealBtn');
const copyBtn = document.getElementById('copyBtn');
const waBtn = document.getElementById('waBtn');
const statusText = document.getElementById('statusText');
const countEl = document.getElementById('genCount');
const nameInput = document.getElementById('nameInput');

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentCat = tab.dataset.cat;
  });
});

function pickMessage(){
  const name = nameInput.value.trim() || 'toi';
  const pool = templates[currentCat];
  const raw = pool[Math.floor(Math.random() * pool.length)];
  return raw.replaceAll('{name}', name);
}

sealBtn.addEventListener('click', () => {
  lastMessage = pickMessage();
  messageEl.textContent = lastMessage;
  messageEl.classList.remove('placeholder');
  genCount++;
  countEl.textContent = genCount + (genCount > 1 ? ' mots doux écrits' : ' mot doux écrit');
  statusText.textContent = '';
});

copyBtn.addEventListener('click', async () => {
  if(!lastMessage){
    statusText.textContent = "Génère d'abord un mot doux avec le sceau.";
    return;
  }
  try{
    await navigator.clipboard.writeText(lastMessage);
    statusText.textContent = 'Copié — prêt à être envoyé.';
  }catch(e){
    statusText.textContent = "Impossible de copier automatiquement, sélectionne le texte manuellement.";
  }
});

waBtn.addEventListener('click', () => {
  if(!lastMessage){
    statusText.textContent = "Génère d'abord un mot doux avec le sceau.";
    return;
  }
  const url = 'https://wa.me/?text=' + encodeURIComponent(lastMessage);
  window.open(url, '_blank');
});
</script>

</body>
</html>
